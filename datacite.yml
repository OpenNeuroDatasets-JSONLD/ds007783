    descriptions:
      - description: >-
          Resting-state functional MRI dataset from mice under propofol anesthesia
          with an awake baseline, acquired on a Bruker BioSpec 94/20 9.4 T scanner
          using a gradient-echo EPI sequence (TR = 2000 ms, 30 axial slices,
          phase-encoding direction j-). The dataset comprises 10 subjects
          (sub-02 to sub-11) with T2-weighted anatomical images and resting-state
          BOLD fMRI, organized according to BIDS 1.9.0, together with the Python
          analysis scripts associated with the corresponding manuscript.
        descriptionType: Abstract
